<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#f5f7f4"
    />

    <!-- NEXTQ favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/NEXTQ_favicon_256.png"
    />

    <!-- iOS / Apple devices -->
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="/NEXTQ_favicon_256.png"
    />

    <!-- Prevent flash of wrong theme -->
    <style>
      html,
      body,
      #root {
        background: #f5f7f4;
        color: #0f172a;
        color-scheme: light;
      }
    </style>

    <!-- Primary SEO -->
    <title>NEXTQ — Smart Queue. Less Waiting.</title>

    <meta
      name="description"
      content="NEXTQ is a smart, app-free clinic appointment and queue management platform for patients, reception teams, doctors, and live queue visibility."
    />

    <link
      rel="canonical"
      href="https://nextq.in/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="NEXTQ — Smart Queue. Less Waiting."
    />

    <meta
      property="og:description"
      content="NEXTQ is a smart, app-free clinic appointment and queue management platform for patients, reception teams, doctors, and live queue visibility."
    />

    <meta
      property="og:url"
      content="https://nextq.in/"
    />

    <meta
      property="og:image"
      content="https://nextq.in/nextq-logo.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="NEXTQ"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="NEXTQ — Smart Queue. Less Waiting."
    />

    <meta
      name="twitter:description"
      content="NEXTQ is a smart, app-free clinic appointment and queue management platform for patients, reception teams, doctors, and live queue visibility."
    />

    <meta
      name="twitter:image"
      content="https://nextq.in/nextq-logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
